# S1-29-T02 Scheduled uptime checks for the hosted app.
# Needs repo secrets APP_URL (e.g. https://learning-resources.vercel.app) and CRON_SECRET (same value as on Vercel).
name: Uptime check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the API health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set"; exit 0; fi
          curl -sS --max-time 30 -X POST "$APP_URL/api/cron/uptime" -H "Authorization: Bearer $CRON_SECRET" -w '\nHTTP %{http_code}\n'
